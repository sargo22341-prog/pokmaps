name: Générer les données
description: Génère la base de données et les images de l'application (tools/build_data.py) et lance les tests du pipeline.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: tools/requirements-dev.txt

    - name: Cache des sources (PokéAPI, pokesprite, PokeAPI/sprites)
      uses: actions/cache@v5
      with:
        path: tools/.cache
        key: data-sources-${{ hashFiles('tools/pokemaps_data/sources.py') }}

    - name: Installer les dépendances
      shell: bash
      run: pip install -r tools/requirements-dev.txt

    - name: Lint Python (ruff)
      shell: bash
      working-directory: tools
      run: |
        ruff check .
        ruff format --check .

    - name: Générer la base et les images
      shell: bash
      run: python tools/build_data.py

    - name: Tests du pipeline
      shell: bash
      working-directory: tools
      run: python -m pytest -q
