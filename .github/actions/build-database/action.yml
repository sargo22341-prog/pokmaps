name: Générer les données
description: Génère les données et les cartes de l'application, puis teste le pipeline.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: tools/requirements*.txt

    - name: Cache des sources (PokéAPI, pokesprite, PokeAPI/sprites, pret)
      id: source-cache
      uses: actions/cache@v5
      with:
        path: |
          tools/.cache/*
          !tools/.cache/map-renders
        # Les images encodées en WebP (webp.py) sont gardées dans ce cache, à côté de leurs sources.
        # sources.py épingle tous les dépôts pret (y compris ceux des jeux en cours d'intégration) :
        # toute mise à jour d'un commit invalide ce cache.
        key: data-sources-${{ hashFiles('tools/pokemaps_data/sources.py', 'tools/pokemaps_data/webp.py') }}

    - name: Cache des cadres et tuiles de toutes les générations
      uses: actions/cache@v5
      with:
        path: tools/.cache/map-renders
        # Chaque entrée vérifie ses pixels ou sa géométrie et son intégrité, indépendamment de cette clé CI.
        key: map-renders-${{ runner.os }}-${{ github.sha }}
        restore-keys: map-renders-${{ runner.os }}-

    - name: Cache des cartes DS préparatoires
      id: sinnoh-map-cache
      uses: actions/cache@v5
      with:
        path: tools/build/preview/sinnoh-maps
        # Aucun repli : toute modification du pipeline, des données ou des dépendances impose un nouveau rendu.
        key: sinnoh-maps-${{ runner.os }}-${{ hashFiles('tools/**/*.py', 'tools/data/**', 'tools/requirements*.txt') }}

    - name: Installer les dépendances
      shell: bash
      run: pip install -r tools/requirements-dev.txt

    - name: Lint Python (ruff)
      shell: bash
      working-directory: tools
      run: |
        ruff check .
        ruff format --check .

    - name: Générer la base et les images
      shell: bash
      run: |
        SECONDS=0
        python tools/build_data.py
        echo "Cache exact restauré : ${{ steps.source-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
        sinnoh_cache_hit="${{ steps.sinnoh-map-cache.outputs.cache-hit }}"
        echo "Cache exact des cartes DS restauré : ${sinnoh_cache_hit}" >> "$GITHUB_STEP_SUMMARY"
        echo "Génération des données (cache restauré selon disponibilité) : ${SECONDS} s" >> "$GITHUB_STEP_SUMMARY"
        cache_size=$(du -sb tools/.cache | cut -f1)
        assets_size=$(du -sb app/src/main/assets | cut -f1)
        echo "Cache des sources : ${cache_size} octets" >> "$GITHUB_STEP_SUMMARY"
        echo "Assets générés : ${assets_size} octets" >> "$GITHUB_STEP_SUMMARY"

    - name: Tests des assets générés
      shell: bash
      working-directory: tools
      # L'éditeur des emplacements (Tk) a besoin d'un affichage : écran virtuel sur le runner.
      run: xvfb-run -a python -m pytest -q

    - name: Tests du pipeline
      shell: bash
      working-directory: tools
      run: |
        SECONDS=0
        python -m pytest -q -m pipeline --durations=20 --capture=tee-sys
        echo "Tests des sources épinglées : ${SECONDS} s" >> "$GITHUB_STEP_SUMMARY"
