name: Vérification explicite du pipeline de données

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Le rendu DS à cache froid et la reconstruction de reproductibilité sont deux opérations longues.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Générer et tester les données depuis les sources épinglées
        uses: ./.github/actions/build-database
      - name: Vérifier les assets générés
        run: python tools/check_assets.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Mesurer l’APK debug avec les assets générés
        run: |
          SECONDS=0
          ./gradlew --stacktrace assembleDebug
          size=$(stat --format=%s app/build/outputs/apk/debug/app-debug.apk)
          echo "Assemblage APK debug : ${SECONDS} s" >> "$GITHUB_STEP_SUMMARY"
          echo "APK debug après génération : ${size} octets" >> "$GITHUB_STEP_SUMMARY"
