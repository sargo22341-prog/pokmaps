name: Release

on:
  push:
    tags: ["v*"]
  # Release manuelle depuis l'onglet Actions : le tag vX.Y.Z est créé sur le commit construit.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (MAJEUR.MINEUR.CORRECTIF, ex. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: APK signé + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Calculer la version depuis le tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Le tag doit être de la forme vMAJEUR.MINEUR.CORRECTIF (ex. v1.2.3), reçu : $tag"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::MINEUR et CORRECTIF doivent être inférieurs à 100"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Vérifier les secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret manquant : $name (voir README, section « Publier une version »)"
              missing=1
            fi
          done
          exit $missing

      - name: Préparer les notes de version
        id: notes
        run: |
          scripts/release-notes.sh extract "$RUNNER_TEMP/release-notes.md"
          if [[ -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Générer les données (base + images)
        uses: ./.github/actions/build-database

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Décoder le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Vérifications
        run: ./gradlew --stacktrace ktlintCheck checkNoGoogleServices lintRelease

      # Commande séparée : les variantes debug et release exportent le schéma Room au même endroit,
      # leurs tâches KSP ne doivent pas tourner en parallèle.
      # Les tests unitaires ne tournent que sur la variante debug (comportement par défaut d'AGP 9).
      - name: Tests unitaires
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build APK release signé
        env:
          POKEMAPS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          POKEMAPS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          POKEMAPS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          POKEMAPS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew --stacktrace assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Préparer les fichiers
        id: files
        run: |
          apk="pokemaps-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Supprimer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pokémaps ${{ steps.version.outputs.name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.empty == 'true' }}
          files: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apk }}.sha256

      - name: Vider les notes publiées sur main
        if: steps.notes.outputs.empty == 'false'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          tagged_notes=$(git show "$RELEASE_SHA:RELEASE_NOTES.md" | sha256sum | cut -d ' ' -f 1)
          main_notes=$(git show origin/main:RELEASE_NOTES.md | sha256sum | cut -d ' ' -f 1)
          if [[ "$tagged_notes" != "$main_notes" ]]; then
            echo "main contient des notes plus récentes ; elles sont conservées."
            exit 0
          fi
          git checkout -B main origin/main
          scripts/release-notes.sh reset
          if git diff --quiet -- RELEASE_NOTES.md; then
            echo "Les notes sont déjà vides."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_NOTES.md
          git commit -m "Docs : vider les notes de version publiées"
          git push origin HEAD:main
