name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assets versionnés + APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Vérifier les assets versionnés
        uses: ./.github/actions/check-assets

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          # Le cache officiel de setup-java évite le composant propriétaire de Gradle Actions 6.
          cache-disabled: true

      - name: Vérifications (ktlint, sans Google Play, lint, tests)
        run: ./gradlew --stacktrace ktlintCheck checkNoGoogleServices lintDebug testDebugUnitTest

      - name: Build APK debug
        run: |
          ./gradlew --stacktrace assembleDebug
          size=$(stat --format=%s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK debug : ${size} octets" >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pokemaps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rapports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
