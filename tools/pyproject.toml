[project]
name = "pokemaps-data"
version = "0.1.0"
description = "Génération de la base de données de Pokémaps"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères typographiques français (’, –, …)

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests importent pokemaps_data depuis tools/, quel que soit le dossier de lancement.
pythonpath = ["."]
filterwarnings = ["error"]
